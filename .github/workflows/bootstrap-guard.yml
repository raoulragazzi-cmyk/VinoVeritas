name: Bootstrap Safety Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require governance files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ENGINEERING_GOVERNANCE.md
          test -f docs/BASELINE_CANDIDATES.md
          test -f .github/pull_request_template.md

      - name: Reject tracked secrets and database dumps
        shell: bash
        run: |
          set -euo pipefail
          bad=""
          while IFS= read -r file; do
            case "$file" in
              .env.example|*/.env.example) continue ;;
              .env|.env.*|*/.env|*/.env.*|.dev.vars|*/.dev.vars|*.sql|*.sqlite|*.sqlite3|*.db|*.dump|*.bak)
                bad+="$file"$'\n'
                ;;
            esac
          done < <(git ls-files)
          if [[ -n "$bad" ]]; then
            echo "Forbidden tracked secret/database artifacts:"
            printf '%s' "$bad"
            exit 1
          fi

      - name: Reject deployment automation during bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'wrangler[[:space:]].*depl[o]y|cloudflare.*depl[o]y' .github/workflows --exclude='bootstrap-guard.yml'; then
            echo "Deploy automation is forbidden until the production baseline is verified and Issue #1 is completed."
            exit 1
          fi
          echo "No deployment automation detected."
